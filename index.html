<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>品牌命名與商標初篩</title>
<meta name="description" content="幫店名、品牌名做初步把關：產生候選名字，依商標法檢查識別性與不得註冊的情形、比對常見知名品牌，整理智慧局、商工登記、社群帳號的查證清單，並預覽招牌效果。">
<meta name="theme-color" content="#2B2350">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* 畫風：招牌試寫台（灰泥牆面＋木刻／霓虹／壓克力招牌預覽） */
:root{
  --bg:#EEEAE3; --paper:#FFFDF9; --ink:#1E1B24; --sub:#625C6B; --line:#D9D2C6;
  --main:#2B2350; --on-main:#F6F2FF; --accent:#C2185B; --neon:#FF2D84;
  --ok:#2E7D4F; --warn:#B7791F; --bad:#B3261E;
  --mono:'JetBrains Mono','Consolas',monospace;
  --serif:'Noto Serif TC','PMingLiU',serif;
  --mq:0px; color-scheme:light;
}
html{font-size:16px;-webkit-text-size-adjust:100%}
html[data-fsize="xl"]{font-size:19px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','Microsoft JhengHei','PingFang TC',sans-serif;font-weight:500;line-height:1.6;padding-top:var(--mq);
  background-image:radial-gradient(rgba(90,70,40,.07) 1px,transparent 1.5px),radial-gradient(rgba(255,255,255,.5) 1px,transparent 1.5px);background-size:11px 11px,17px 17px;background-position:0 0,5px 8px}
body.has-marquee{--mq:34px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);font-weight:700}
:focus-visible{outline:3px solid #F2B705;outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.3}
/* 不可拿掉：所有 hidden 切換都靠這行 */
[hidden]{display:none!important}

#marqueeBar{position:fixed;top:0;left:0;right:0;height:34px;background:var(--main);z-index:60;overflow:hidden;display:none;align-items:center}
#marqueeBar.show{display:flex}
#marqueeTrack{display:inline-block;white-space:nowrap;padding-left:100%;font-size:15px;font-weight:700;color:var(--on-main);animation:marquee-scroll 30s linear infinite}
#marqueeBar:hover #marqueeTrack{animation-play-state:paused}
@keyframes marquee-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

#app{max-width:74rem;margin:0 auto;padding:.9rem 1rem calc(2rem + env(safe-area-inset-bottom))}
.bar{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.bar h1{flex:1 1 16rem;font-family:var(--serif);font-size:1.65rem;letter-spacing:.04em;color:var(--main)}
.bar h1 .neon{display:inline-grid;place-items:center;width:2.3rem;height:2.3rem;border-radius:.5rem;background:#17131F;color:#FFE3EF;margin-right:.5rem;vertical-align:.1rem;font-size:1.15rem;
  text-shadow:0 0 3px #fff,0 0 8px var(--neon),0 0 16px var(--neon);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.bar h1 small{display:block;font-family:'Noto Sans TC',sans-serif;font-size:.82rem;font-weight:500;letter-spacing:0;color:var(--sub);margin-top:.2rem}
.ibtn{min-height:2.6rem;padding:0 .8rem;border:1.5px solid var(--line);border-radius:.55rem;background:var(--paper);font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:.3rem;text-decoration:none;color:var(--ink)}
.ibtn:hover{border-color:var(--main)}
.warn-line{margin:.45rem 0 0;font-size:.82rem;color:var(--sub)}
.warn-line button{background:none;border:0;padding:0;color:var(--bad);font-weight:700;text-decoration:underline;font-size:inherit}

.tabs{display:flex;gap:.3rem;margin-top:1rem;border-bottom:3px solid var(--main);flex-wrap:wrap}
.tabs button{border:0;border-radius:.55rem .55rem 0 0;background:#E1DAEE;color:var(--sub);font-weight:700;padding:.45rem .95rem;min-height:2.7rem}
.tabs button[aria-selected="true"]{background:var(--main);color:var(--on-main)}
.tabs .cnt{display:inline-block;min-width:1.2rem;margin-left:.3rem;border-radius:1rem;background:var(--accent);color:#fff;font-size:.72rem;padding:0 .35rem;font-family:var(--mono)}
.tabs .cnt:empty{display:none}

.card{background:var(--paper);border:1.5px solid var(--line);border-radius:.8rem;padding:.9rem 1rem;margin-top:.8rem}
.card h3{font-family:var(--serif);font-size:1.12rem;color:var(--main);margin-bottom:.5rem;display:flex;gap:.45rem;align-items:center}
.card h3 .tag{display:inline-grid;place-items:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--main);color:#fff;font-family:var(--mono);font-size:.85rem}
.card.empty{text-align:center;color:var(--sub);padding:1.6rem 1rem}
.small{font-size:.84rem;color:var(--sub)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(14rem,100%),1fr));gap:.6rem .8rem}
.row>*{min-width:0}
.fld{display:block;font-weight:700;font-size:.88rem}
.fld small{display:block;font-weight:500;color:var(--sub);font-size:.76rem;line-height:1.4;margin-top:.1rem}
.fld input,.fld select,textarea{display:block;width:100%;min-height:2.6rem;margin-top:.15rem;border:1.5px solid var(--line);border-radius:.5rem;padding:.3rem .55rem;background:#fff;font-weight:500}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3rem;min-height:2.6rem;border:0;border-radius:.55rem;background:var(--main);color:#fff;font-weight:900;padding:.2rem 1rem;text-decoration:none}
.btn.alt{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.red{background:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.7rem}
.seg{display:inline-flex;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.55rem;overflow:hidden;background:#fff;margin-top:.15rem}
.seg button{border:0;background:none;padding:.3rem .8rem;min-height:2.4rem;font-weight:700;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--main);color:#fff}
.inds{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(9rem,100%),1fr));gap:.4rem}
.inds button{border:1.5px solid var(--line);background:#fff;border-radius:.55rem;min-height:2.8rem;font-weight:700;color:var(--ink)}
.inds button[aria-pressed="true"]{background:var(--main);border-color:var(--main);color:#fff}
.classbox{margin-top:.7rem;background:#F3EFFA;border-left:4px solid var(--main);border-radius:.4rem;padding:.55rem .8rem;font-size:.9rem}
.classbox ul{margin:.3rem 0;padding-left:1.1em}
.cls{display:inline-block;background:var(--main);color:#fff;border-radius:.3rem;font-size:.78rem;padding:0 .4rem;margin-right:.35rem;font-family:var(--mono)}

/* 候選卡 */
.tools .filt{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin-top:.7rem}
.filt>button{border:1.5px solid var(--line);background:#fff;border-radius:2rem;padding:.2rem .75rem;min-height:2.3rem;font-weight:700;color:var(--sub)}
.filt>button[aria-pressed="true"]{border-color:var(--main);color:var(--main);background:#EFEAF9}
.filt .sp{flex:1 1 1rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(20rem,100%),1fr));gap:.8rem;margin-top:.8rem}
.cand{background:var(--paper);border:1.5px solid var(--line);border-radius:.8rem;overflow:hidden;display:flex;flex-direction:column}
.cand.red{border-color:#E4ADA8}.cand.yellow{border-color:#E8D29E}.cand.green{border-color:#A9D3B6}
.cbody{padding:.6rem .8rem .7rem;display:flex;flex-direction:column;gap:.35rem;flex:1}
.chead{display:flex;align-items:center;gap:.45rem}
.chead .score{margin-left:auto;font-family:var(--mono);font-size:.8rem;color:var(--sub)}
.lamp{display:inline-block;width:.95rem;height:.95rem;border-radius:50%;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2);vertical-align:-2px;margin-right:.2rem}
.lamp.red{background:var(--bad)}.lamp.yellow{background:#E3A82B}.lamp.green{background:#3E9A5D}
.star{border:0;background:none;font-size:1.35rem;line-height:1;color:#C9A227;min-width:2.3rem;min-height:2.3rem}
.bar2{height:.35rem;background:#ECE6DB;border-radius:1rem;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--main))}
.iss{margin:0;padding-left:1.1em;font-size:.86rem}
.iss li{margin:.15rem 0}
.iss li.red::marker{color:var(--bad)}.iss li.yellow::marker{color:#C98A12}
.iss small{display:block;color:var(--sub);font-size:.74rem}
.ok{color:var(--ok)!important}
.idea{font-style:italic}
.cfoot{display:flex;align-items:center;gap:.5rem;margin-top:auto;padding-top:.3rem;border-top:1px dashed var(--line)}
.cfoot .small{margin-right:auto}
.lnk{border:0;background:none;color:var(--accent);font-weight:700;min-height:2.2rem;padding:0 .3rem}
.lnk.del{color:var(--sub)}

/* 招牌 */
.sign{height:5.4rem;display:flex;align-items:center;justify-content:center;padding:.4rem .9rem;position:relative;overflow:hidden}
.sign span{font-weight:900;font-size:1.55rem;text-align:center;line-height:1.15;overflow-wrap:anywhere;max-width:100%}
.sign.wood{background:#9A6A3E;background-image:repeating-linear-gradient(176deg,rgba(60,30,10,.18) 0 2px,transparent 2px 9px),repeating-linear-gradient(183deg,rgba(255,220,170,.12) 0 1px,transparent 1px 13px),linear-gradient(#A8784A,#8A5B32);
  border-bottom:6px solid #5A3A22}
.sign.wood span{font-family:var(--serif);color:#3A2210;text-shadow:0 1px 0 rgba(255,225,180,.45),0 -1px 0 rgba(0,0,0,.45);letter-spacing:.06em}
.sign.neon{background:#16121E;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:100% 18px,36px 18px}
.sign.neon span{color:#FFE6F1;font-weight:700;text-shadow:0 0 2px #fff,0 0 7px var(--neon),0 0 16px var(--neon),0 0 30px #FF5FA6}
.sign.acrylic{background:linear-gradient(#5C5470,#433B58)}
.sign.acrylic span{color:var(--main);padding:.35rem .9rem;border-radius:.3rem;box-shadow:0 6px 12px rgba(0,0,0,.3),inset 0 1px 0 #fff;
  background:radial-gradient(circle at 7px 7px,#B9B3C6 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 7px) 7px,#B9B3C6 2.5px,transparent 3px),radial-gradient(circle at 7px calc(100% - 7px),#B9B3C6 2.5px,transparent 3px),radial-gradient(circle at calc(100% - 7px) calc(100% - 7px),#B9B3C6 2.5px,transparent 3px),linear-gradient(#fff,#F1EEF6)}
.sign.mini{height:3.6rem;width:9.5rem;flex:none;border-radius:.5rem}
.sign.mini span{font-size:1rem;padding:.25rem .5rem}

/* 查證 */
.vtop{display:flex;gap:.8rem;align-items:center;margin-bottom:.6rem;flex-wrap:wrap}
.vname{font-size:1.25rem;font-family:var(--serif);color:var(--main)}
table.chk{width:100%;border-collapse:collapse;margin-top:.6rem;font-size:.88rem}
table.chk td{border-top:1px solid var(--line);padding:.4rem .3rem;vertical-align:top}
table.chk td small{display:block;color:var(--sub);font-size:.76rem}
table.chk select{min-height:2.4rem;border:1.5px solid var(--line);border-radius:.45rem;background:#fff;padding:0 .4rem;max-width:9rem}
.verdict{margin-top:.6rem;border-radius:.5rem;padding:.5rem .8rem;font-weight:700;background:#EEE9E0;color:var(--sub)}
.verdict.red{background:#F7DAD7;color:#8C1C15}.verdict.yellow{background:#F7EBC8;color:#7A5205}.verdict.green{background:#D6EEDD;color:#1F5C37}
.aiout{white-space:pre-wrap;font-size:.9rem;margin-top:.4rem}
.tw{overflow-x:auto}
table.law{width:100%;border-collapse:collapse;font-size:.88rem;min-width:34rem}
table.law th,table.law td{border:1px solid var(--line);padding:.35rem .5rem;text-align:left;vertical-align:top}
table.law th{background:#EFEAF9}

/* 彈窗、設定 */
#modal{position:fixed;inset:0;background:rgba(20,16,30,.55);z-index:80;display:none;align-items:center;justify-content:center;padding:1rem}
#modal.show{display:flex}
#modalBox{background:var(--bg);width:100%;max-width:36rem;max-height:calc(100dvh - 2rem);overflow:auto;border-radius:1rem;padding:1rem 1.1rem}
#modalBox h2{font-family:var(--serif);font-size:1.3rem;color:var(--main);margin-bottom:.4rem}
#modalBox ul{padding-left:1.2em;margin:.3rem 0}
#modalBox li{margin:.2rem 0}
.set-sec{background:#fff;border:1.5px solid var(--line);border-radius:.6rem;margin-bottom:.45rem}
.set-sec>summary{list-style:none;cursor:pointer;display:flex;gap:.5rem;align-items:center;padding:.55rem .75rem;font-weight:700;min-height:2.9rem}
.set-sec>summary::-webkit-details-marker{display:none}
.set-sec>summary::after{content:'▸';transition:transform .2s}
.set-sec[open]>summary::after{transform:rotate(90deg)}
.set-sec .sst{flex:1 1 0}
.set-sec .ssv{font-weight:500;font-size:.78rem;color:var(--sub);text-align:right}
.set-body{padding:0 .75rem .75rem}
.vstack{display:grid;gap:.45rem;margin-top:.5rem}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:.7rem;z-index:90;font-weight:700;max-width:calc(100vw - 2rem)}
.foot{text-align:center;font-size:.82rem;color:var(--sub);margin-top:2rem}
.foot a{margin:0 .3rem}
.print-head,#pdfWatermark{display:none}

@media (max-width:600px){.bar h1{font-size:1.35rem}.sign span{font-size:1.3rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}#marqueeTrack{animation-duration:90s!important}}
@media print{
  @page{size:A4;margin:12mm}
  html{font-size:11px}
  body{background:#fff;padding:0}
  #marqueeBar,.noprint,.tabs,.toast,#modal,.foot,.bar,.warn-line,.btns,.tools,.star,.cfoot,.lnk{display:none!important}
  #app{max-width:none;padding:0}
  .print-head{display:block;margin-bottom:.5rem}
  .print-head h1{font-family:var(--serif);font-size:1.6rem;color:var(--main)}
  .panel{display:none!important}
  .panel[data-p="names"],.panel[data-p="verify"]{display:block!important}
  .cand,.card{break-inside:avoid;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .sign{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #pdfWatermark{display:flex!important;position:fixed;inset:0;z-index:9999;align-items:center;justify-content:center;pointer-events:none}
  #pdfWatermark img{width:42%;min-width:200px;max-width:380px;opacity:.11}
}
</style>
</head>
<body>
<div id="marqueeBar"><div id="marqueeTrack"></div></div>
<main id="app"></main>
<div id="modal" role="dialog" aria-modal="true" aria-label="對話框"><div id="modalBox"></div></div>
<noscript>這個工具需要開啟 JavaScript 才能使用。</noscript>
<script src="data.js"></script>
<script src="watermark.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
